<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <title>500円お小遣い帳</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --holiday: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 110px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date-badge {
      font-size: 15px;
      font-weight: 700;
      background: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      color: #334155;
    }
    .sim-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .text-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      cursor: pointer;
    }
    .text-btn:active {
      background: #f1f5f9;
    }
    .btn-today {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: var(--primary-dark);
      font-weight: 700;
    }

    /* 勤務状態切り替えバナー */
    .work-status-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .status-left {
      display: flex;
      flex-direction: column;
    }
    .day-type-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--subtext);
    }
    .day-type-name {
      font-size: 14px;
      font-weight: 800;
      color: #334155;
    }
    .work-toggle-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .work-toggle-btn.btn-is-working {
      background: #ecfdf5;
      color: var(--primary-dark);
      border: 1px solid #a7f3d0;
    }
    .work-toggle-btn.btn-is-holiday {
      background: #f1f5f9;
      color: var(--subtext);
      border: 1px solid var(--border);
    }

    .balance-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 24px 20px 20px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      margin-bottom: 14px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .balance-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
    }
    .balance-amount {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.5px;
      color: var(--primary);
      transition: color 0.2s ease;
      word-break: break-all;
    }
    .balance-amount.negative {
      color: var(--danger);
    }
    .balance-status {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      background: #ecfdf5;
      color: var(--primary-dark);
    }
    .balance-status.negative {
      background: #fef2f2;
      color: var(--danger);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--card);
      padding: 10px 6px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-title {
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 4px;
    }
