<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <title>500円お小遣い帳</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 110px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .date-badge {
      font-size: 14px;
      font-weight: 700;
      background: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      color: #334155;
    }
    .sim-buttons {
      display: flex;
      gap: 6px;
    }
    .text-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      cursor: pointer;
    }
    .balance-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 28px 20px 22px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .balance-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
    }
    .balance-amount {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.5px;
      color: var(--primary);
      transition: color 0.2s ease;
      word-break: break-all;
    }
    .balance-amount.negative {
      color: var(--danger);
    }
    .balance-status {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      background: #ecfdf5;
      color: var(--primary-dark);
    }
    .balance-status.negative {
      background: #fef2f2;
      color: var(--danger);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--card);
      padding: 12px 8px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-title {
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 700;
    }
    .history-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      flex: 1;
    }
    .history-header {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-list {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .item-memo {
      font-weight: 600;
      color: var(--text);
    }
    .item-date {
      font-size: 11px;
      color: var(--subtext);
    }
    .item-amount-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-amount {
      font-weight: 700;
      color: #334155;
    }
    .history-item-del {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }
    .empty-state {
      text-align: center;
      color: var(--subtext);
      font-size: 13px;
      padding: 30px 0;
    }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .open-modal-btn {
      width: 100%;
      max-width: 440px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s ease;
    }
    .open-modal-btn:active {
      transform: scale(0.98);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 20;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 28px 28px 0 0;
      padding: 24px 20px 40px;
      animation: slideUp 0.22s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 800;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: var(--subtext);
    }
    .ocr-box {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      text-align: center;
    }
    .ocr-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }
    .ocr-button-label {
      display: inline-block;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    .ocr-status {
      font-size: 12px;
      color: #2563eb;
      margin-top: 8px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: var(--primary);
    }
    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="displayDate" class="date-badge"></div>
    <div class="sim-buttons">
      <button class="text-btn" id="nextDayBtn">翌日へ (+1日)</button>
      <button class="text-btn" id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="balance-card">
    <div class="balance-label">現在のお小遣い残高</div>
    <div id="balanceDisplay" class="balance-amount">500円</div>
    <div id="balanceStatus" class="balance-status">貯蓄中 (プラス)</div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-title">経過日数</div>
      <div class="stat-value" id="daysCount">1日目</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">累計予算</div>
      <div class="stat-value" id="totalBudget">500円</div>
    </div>
    <div class="stat-box">
      <div class="stat-title">累計出費</div>
      <div class="stat-value" id="totalExpense">0円</div>
    </div>
  </div>

  <div class="history-card">
    <div class="history-header">
      <span>支出の履歴</span>
      <span id="todayExpenseLabel" style="font-size: 13px; color: var(--subtext);">今日: 0円</span>
    </div>
    <ul id="historyList" class="history-list">
      <li class="empty-state">まだ出費の記録はありません</li>
    </ul>
  </div>

  <div class="bottom-bar">
    <button class="open-modal-btn" id="openModalBtn">使った金額を入力</button>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>使った金額を記録</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <div class="ocr-box">
        <div class="ocr-title">📷 レシートを撮って金額を自動入力</div>
        <label class="ocr-button-label">
          レシートを撮影
          <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none;">
        </label>
        <div id="ocrStatus" class="ocr-status" style="display:none;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">使った金額 (円)</label>
        <input type="number" id="spendAmount" class="input-field" placeholder="150" inputmode="numeric">
      </div>

      <div class="form-group">
        <label class="form-label">メモ (任意)</label>
        <input type="text" id="spendMemo" class="input-field" placeholder="カフェ、コンビニ など" style="font-size: 15px; font-weight: normal;">
      </div>

      <button id="submitSpendBtn" class="submit-btn">この金額を引く</button>
    </div>
  </div>

  <script>
    const DAILY_BUDGET = 500;
    const STORAGE_KEY = 'daily_allowance_acc_v3';

    function getTodayStr(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {}
      }
      const today = getTodayStr();
      const init = {
        startDate: today,
        dayOffset: 0,
        expenses: []
      };
      saveData(init);
      return init;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getCurrentSimulatedDate(data) {
      const d = new Date();
      d.setDate(d.getDate() + (data.dayOffset || 0));
      return d;
    }

    function calculateStats(data) {
      const start = new Date(data.startDate);
      const current = getCurrentSimulatedDate(data);

      start.setHours(0,0,0,0);
      current.setHours(0,0,0,0);

      const diffTime = current.getTime() - start.getTime();
      let days = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
      if (days < 1) days = 1;

      const totalBudget = days * DAILY_BUDGET;
      const totalExpense = data.expenses.reduce((sum, item) => sum + item.amount, 0);
      const balance = totalBudget - totalExpense;

      const todayStr = getTodayStr(current);
      const todayExpense = data.expenses
        .filter(item => item.dateStr === todayStr)
        .reduce((sum, item) => sum + item.amount, 0);

      return { days, totalBudget, totalExpense, balance, todayExpense, todayStr };
    }

    function renderUI() {
      const data = loadData();
      const stats = calculateStats(data);

      document.getElementById('displayDate').textContent = stats.todayStr.replace(/-/g, '/');
      document.getElementById('daysCount').textContent = `${stats.days}日目`;
      document.getElementById('totalBudget').textContent = `${stats.totalBudget.toLocaleString()}円`;
      document.getElementById('totalExpense').textContent = `${stats.totalExpense.toLocaleString()}円`;
      document.getElementById('todayExpenseLabel').textContent = `今日: ${stats.todayExpense.toLocaleString()}円`;

      const balanceEl = document.getElementById('balanceDisplay');
      const statusEl = document.getElementById('balanceStatus');

      balanceEl.textContent = `${stats.balance.toLocaleString()}円`;

      if (stats.balance < 0) {
        balanceEl.classList.add('negative');
        statusEl.classList.add('negative');
        statusEl.textContent = `使いすぎ中 (赤字: ${Math.abs(stats.balance).toLocaleString()}円)`;
      } else {
        balanceEl.classList.remove('negative');
        statusEl.classList.remove('negative');
        statusEl.textContent = `貯蓄中 (余裕: +${stats.balance.toLocaleString()}円)`;
      }

      const listEl = document.getElementById('historyList');
      if (data.expenses.length === 0) {
        listEl.innerHTML = '<li class="empty-state">まだ出費の記録はありません</li>';
      } else {
        listEl.innerHTML = data.expenses.map((item, idx) => `
          <li class="history-item">
            <div class="history-item-left">
              <span class="item-memo">${item.memo || '支出'}</span>
              <span class="item-date">${item.dateStr.slice(5).replace('-', '/')} ${item.time || ''}</span>
            </div>
            <div class="item-amount-wrap">
              <span class="item-amount">-${item.amount.toLocaleString()}円</span>
              <button class="history-item-del" onclick="deleteItem(${idx})">&times;</button>
            </div>
          </li>
        `).slice().reverse().join('');
      }
    }

    function deleteItem(index) {
      const data = loadData();
      data.expenses.splice(index, 1);
      saveData(data);
      renderUI();
    }

    document.getElementById('openModalBtn').onclick = () => {
      document.getElementById('spendAmount').value = '';
      document.getElementById('spendMemo').value = '';
      document.getElementById('ocrStatus').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('spendAmount').focus();
    };

    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('modalOverlay').classList.remove('active');
    };

    document.getElementById('submitSpendBtn').onclick = () => {
      const amtInput = document.getElementById('spendAmount');
      const memoInput = document.getElementById('spendMemo');
      const amt = parseInt(amtInput.value, 10);

      if (isNaN(amt) || amt <= 0) {
        alert('正しい金額を入力してください');
        return;
      }

      const data = loadData();
      const current = getCurrentSimulatedDate(data);
      const dateStr = getTodayStr(current);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      data.expenses.push({
        amount: amt,
        memo: memoInput.value.trim(),
        dateStr: dateStr,
        time: timeStr
      });

      saveData(data);
      document.getElementById('modalOverlay').classList.remove('active');
      renderUI();
    };

    document.getElementById('nextDayBtn').onclick = () => {
      const data = loadData();
      data.dayOffset = (data.dayOffset || 0) + 1;
      saveData(data);
      renderUI();
    };

    document.getElementById('resetBtn').onclick = () => {
      if (confirm('データをすべてリセットして、今日を「1日目（残高500円）」に戻しますか？')) {
        localStorage.removeItem(STORAGE_KEY);
        loadData();
        renderUI();
      }
    };

    document.getElementById('receiptInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocrStatus');
      statusEl.style.display = 'block';
      statusEl.textContent = 'レシートを解析しています...';

      try {
        const result = await Tesseract.recognize(file, 'jpn+eng');
        const text = result.data.text;
        const matches = text.match(/[¥￥]?\s*([0-9]{1,3}(,[0-9]{3})+|[0-9]{2,6})\s*円?/g);

        if (matches && matches.length > 0) {
          const numbers = matches
            .map(m => parseInt(m.replace(/[^0-9]/g, ''), 10))
            .filter(n => n > 0 && n < 100000);

          if (numbers.length > 0) {
            const maxVal = Math.max(...numbers);
            document.getElementById('spendAmount').value = maxVal;
            statusEl.textContent = `読み取り完了: ${maxVal}円 をセットしました`;
            return;
          }
        }
        statusEl.textContent = '金額を自動判定できませんでした。手入力してください。';
      } catch (err) {
        statusEl.textContent = '読み取りに失敗しました。';
      }
    });

    window.onload = renderUI;
  </script>
</body>
</html>
